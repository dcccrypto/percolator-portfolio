[package]
name = "percolator-portfolio"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "USDC cross-margin wrapper over percolator-prog isolated markets"
repository = "https://github.com/dcccrypto/percolator-portfolio"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("sbf", "bpf"))', 'cfg(kani)', 'cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

[lib]
crate-type = ["cdylib", "lib"]
name = "percolator_portfolio"
path = "src/portfolio.rs"

[features]
no-entrypoint = []
test = []
test-sbf = ["test"]
kani = []
mainnet = []

[dependencies]
solana-program = "1.18"
# spl-token kept on the manifest because Deposit/Withdraw CPIs (next
# milestone) will use it. Dead-but-imminent.
spl-token = { version = "4.0", features = ["no-entrypoint"] }
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
# Engine crate — read-only type definitions for `crate::margin` to
# decode slab Account structs without re-implementing layout. The
# wrapper does NOT call engine functions or share engine semantics
# beyond struct decode. Pin to a specific FORK commit so engine schema
# changes (Waves 4/5/6 of the upstream sync) are explicit re-pins +
# re-tests on the wrapper side, not silent semantic shifts.
percolator = { path = "../percolator" }
# percolator-prog with no-entrypoint — gives us the slab layout
# constants (ENGINE_OFF, ENGINE_LEN, etc.) and Account/RiskEngine
# accessors without bringing in the program entrypoint (which would
# collide with our own declare_id!). Toly's #58 close explicitly
# endorsed on-chain programs reading slab state via passed accounts,
# which is what we use this for — pre-trade aggregate IM check and
# atomic rebalance-before-trade fold-in.
percolator-prog = { path = "../percolator-prog", default-features = false, features = ["no-entrypoint"] }
# Pins for the SBF toolchain (rustc 1.84, no edition2024). Each of these
# crates' next-major releases require edition2024, so pin to the last
# 1.84-compatible version. Same workaround percolator-prog ships with.
blake3 = "=1.8.1"
indexmap = "=2.7.1"
hashbrown = "=0.15.2"
once_cell = "=1.20.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"

[dev-dependencies]
bincode = "1"
solana-sdk = "1.18"
solana-program-runtime = "1.18"
litesvm = "0.1"
