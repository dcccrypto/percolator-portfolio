name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: "1.18.26"

jobs:
  build-sbf:
    name: Build BPF binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling crates
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dcccrypto/percolator.git "$GITHUB_WORKSPACE/../percolator"
          git -C "$GITHUB_WORKSPACE/../percolator" fetch --depth 1 origin 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git -C "$GITHUB_WORKSPACE/../percolator" checkout --detach 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git clone --depth 1 https://github.com/dcccrypto/percolator-prog.git "$GITHUB_WORKSPACE/../percolator-prog"
          git -C "$GITHUB_WORKSPACE/../percolator-prog" fetch --depth 1 origin 1dd268ad97522276a67636375030704c8fb60af3
          git -C "$GITHUB_WORKSPACE/../percolator-prog" checkout --detach 1dd268ad97522276a67636375030704c8fb60af3
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sbf-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: cargo build-sbf --locked
        run: cargo build-sbf -- --locked

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-sbf
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling crates
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dcccrypto/percolator.git "$GITHUB_WORKSPACE/../percolator"
          git -C "$GITHUB_WORKSPACE/../percolator" fetch --depth 1 origin 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git -C "$GITHUB_WORKSPACE/../percolator" checkout --detach 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git clone --depth 1 https://github.com/dcccrypto/percolator-prog.git "$GITHUB_WORKSPACE/../percolator-prog"
          git -C "$GITHUB_WORKSPACE/../percolator-prog" fetch --depth 1 origin 1dd268ad97522276a67636375030704c8fb60af3
          git -C "$GITHUB_WORKSPACE/../percolator-prog" checkout --detach 1dd268ad97522276a67636375030704c8fb60af3
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build BPF
        run: cargo build-sbf -- --locked
      - name: Run unit + integration tests
        run: cargo test --locked
      # e2e tests require percolator-prog .so — CI must clone it
      # separately or use a published artifact. Flagged in README.
      # - name: Run e2e tests
      #   run: cargo test --test test_e2e

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling crates
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dcccrypto/percolator.git "$GITHUB_WORKSPACE/../percolator"
          git -C "$GITHUB_WORKSPACE/../percolator" fetch --depth 1 origin 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git -C "$GITHUB_WORKSPACE/../percolator" checkout --detach 64cd8f245211c4d5dc4fbc8cc5eaf231180ad05e
          git clone --depth 1 https://github.com/dcccrypto/percolator-prog.git "$GITHUB_WORKSPACE/../percolator-prog"
          git -C "$GITHUB_WORKSPACE/../percolator-prog" fetch --depth 1 origin 1dd268ad97522276a67636375030704c8fb60af3
          git -C "$GITHUB_WORKSPACE/../percolator-prog" checkout --detach 1dd268ad97522276a67636375030704c8fb60af3
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kani-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-kani
        run: cargo install --locked kani-verifier && cargo kani setup
      - name: Run all proofs
        run: cargo kani --features kani

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
